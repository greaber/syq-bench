[project]
name = "syq-bench"
version = "0.1.0"
description = "Benchmark syq against rsync and cp on your own hardware, in the cloud, or across syq versions"
readme = "README.md"
authors = [{ name = "Grant Reaber", email = "grant@claw.party" }]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
syq-bench = "syq_bench.cli:main"
syq-bench-fly = "syq_bench.fly:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
cloud = ["reframe-hpc[no-analytics]==4.10.3"]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
