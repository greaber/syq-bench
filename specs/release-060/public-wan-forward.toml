name = "public-wan-forward"
description = "Release 0.6.0 with contemporaneous 0.5.2 controls"
[endpoints]
source = "/path/to/empty-source-scratch"
destination = "destination-host:/path/to/empty-destination-scratch"
ssh = "/path/to/benchmark-ssh"

[[tools]]
name = "syq"
kind = "syq"
binary = "/path/to/syq"
args = ["rsync", "-a", "--stats", "--no-progress", "--syq-no-bootstrap", "--rsync-path", "/path/to/syq-resource-helper"]
debug = false

[[tools]]
name = "syq-ssh"
kind = "syq"
binary = "/path/to/syq"
args = ["rsync", "-a", "--stats", "--no-progress", "--syq-no-bootstrap", "--rsync-path", "/path/to/syq-resource-helper", "--syq-no-tcp"]
debug = false

[[tools]]
name = "rsync"
kind = "rsync"
binary = "/usr/bin/rsync"
args = ["-a", "--rsync-path", "/path/to/rsync-resource-helper"]
debug = false

[[workloads]]
name = "large-file"
kind = "large-file"
bytes = 1073741824
files = 1

[protocol]
repeats = 3
seed = 204330278
cache = "warm"
durable = false
verify = true
probes = false
tool_timeout = 600
slow_cutoff = 0
order = [["syq", "syq-ssh", "rsync"], ["syq-ssh", "rsync", "syq"], ["rsync", "syq", "syq-ssh"]]
