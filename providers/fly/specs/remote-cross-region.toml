# High-RTT variant of remote-comparison.toml. It preserves the same operation
# modes and file shapes, but uses less data so the deliberately slow ssh-only
# paths complete within a short iteration budget.
name = "fly-remote-cross-region"
description = "scaled fresh-file and incremental remote-copy comparisons over a high-RTT Fly path"

[endpoints]
source = "/memory/syq-bench/source"
destination = "root@destination.process.PLACEHOLDER.internal:/memory/syq-bench/destination"
ssh = "ssh -i /root/.ssh/benchmark -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ConnectTimeout=10"

[[tools]]
name = "syq"
args = ["rsync", "-a", "--no-bootstrap"]

[[tools]]
name = "syq-no-tcp"
kind = "syq"
args = ["rsync", "-a", "--no-bootstrap", "--no-tcp"]
workloads = ["fresh-large", "fresh-small"]

[[tools]]
name = "syq-j8"
kind = "syq"
args = ["rsync", "-a", "--no-bootstrap"]
jobs = 8
workloads = ["fresh-large", "fresh-small"]

[[tools]]
name = "rsync"

[[tools]]
name = "tar"
workloads = ["fresh-large", "fresh-small"]

[[workloads]]
name = "fresh-large"
kind = "large-file"
bytes = "64MiB"

[[workloads]]
name = "fresh-small"
kind = "small-files"
files = 2000
bytes = "8MiB"

[[workloads]]
name = "delta-edited"
kind = "small-files"
files = 4
bytes = "64MiB"
changed = 1.0
mutate = "blocks"

[[workloads]]
name = "delta-rewritten"
kind = "small-files"
files = 4
bytes = "64MiB"
changed = 1.0
mutate = "rewrite"

[protocol]
repeats = 1
cache = "warm"
durable = false
verify = true
probes = false
tool_timeout = 15
slow_cutoff = 5
