# High-RTT counterpart to transport-validation.toml. The smaller payload keeps
# each measurement short while retaining enough bulk data to distinguish the
# direct TCP path from SSH setup and flow-control costs.
name = "fly-transport-validation-cross-region"
description = "cross-region validation of direct TCP and SSH transfer paths"

[endpoints]
source = "/memory/syq-bench/source"
destination = "root@destination.process.PLACEHOLDER.internal:/memory/syq-bench/destination"
ssh = "ssh -i /root/.ssh/benchmark -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ConnectTimeout=10"

[[tools]]
name = "syq"
debug = true
args = ["rsync", "-a", "-vv", "--syq-no-bootstrap", "--syq-connections", "8"]

[[tools]]
name = "syq-no-tcp"
kind = "syq"
debug = true
args = ["rsync", "-a", "-vv", "--syq-no-bootstrap", "--syq-no-tcp", "--syq-connections", "8"]

[[tools]]
name = "rsync"

[[workloads]]
name = "large-file"
kind = "large-file"
bytes = "32MiB"

[protocol]
repeats = 1
cache = "warm"
durable = false
verify = true
probes = false
tool_timeout = 12
slow_cutoff = 5
