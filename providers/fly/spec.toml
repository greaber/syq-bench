# The Fly campaign overrides the endpoint placeholders and adds its network,
# storage, and region labels to the raw spec stored with each result.
name = "fly-reference"
description = "same-region Fly Machine reference run"

[endpoints]
source = "/tmp/syq-bench/source"
destination = "root@destination.process.PLACEHOLDER.internal:/tmp/syq-bench/destination"
ssh = "ssh -i /root/.ssh/benchmark -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ConnectTimeout=10"

[[tools]]
name = "syq"
args = ["rsync", "-a", "--no-bootstrap"]
jobs = 8

[[tools]]
name = "rsync"

[[tools]]
name = "tar"

[[workloads]]
name = "large-file"
kind = "large-file"
bytes = "512MiB"

[protocol]
repeats = 1
cache = "warm"
durable = false
verify = true
probes = false
tool_timeout = 20
slow_cutoff = 5
