description = "Copy a folder of small files onto the same shared drive."
note = "The same NFS network drive."
setup = "syq 0.5.2, source fd2b17c; static GNU build with Rust 1.94.1. Three rotated repetitions, each checksum-verified outside timing. Generated incompressible data, seed 204330278; compression off. No final flush: completion is not a durability measurement. A server with two Xeon Platinum 8460Y+ CPUs, 160 logical CPUs and the performance governor; Linux 5.15.0-126-generic. Its ext4 system volume, XFS data volume and NFS mount are distinct placements. Shared-host activity was observed but not eliminated. Source fixture pages evicted, metadata warm; device caches and drive history uncontrolled. The 32-worker control also disables automatic tuning and the automatic sequential NFS fallback, so it is not an isolated worker-count comparison. NFS 4.2; server cache and backing filesystem uncontrolled. Eviction affects the client only. The copy process accesses the NFS mount directly, without an SSH relay. "
manual_recipe = "specs/release-052/README.md"
captures = ["data/release-052-private-nfs-metadata-25k.json"]
