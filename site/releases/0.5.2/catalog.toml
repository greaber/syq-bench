setup = "syq 0.5.2, source fd2b17c; static GNU build with Rust 1.94.1. Three rotated repetitions, each checksum-verified outside timing. Generated incompressible data, seed 204330278; compression off. No final flush: completion is not a durability measurement. One Hetzner Server Auction allocation: Ryzen 9 5950X, 32 logical CPUs, 128 GiB RAM, two dedicated 3.84 TB Samsung PM9A3 NVMe drives; Linux 6.12.67, powersave governor. Source fixture pages evicted, metadata warm; device caches and drive history uncontrolled. The 32-worker control also disables automatic tuning and the automatic sequential NFS fallback, so it is not an isolated worker-count comparison. Source and destination share one ext4 filesystem on one NVMe drive, mounted noatime. "
manual_recipe = "specs/release-052/README.md"
captures = ["data/release-052-public-ext4-same.json"]
