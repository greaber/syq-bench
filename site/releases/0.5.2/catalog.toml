# syq 0.5.2 release selection. Measurements stay in data/, not presentation metadata.
introduction = ["We tested syq 0.5.2 against rsync and cp on local drives, shared network drives, and connections between servers."]

[overview]
subtitle = "How syq 0.5.2 compares with rsync and cp."
[[overview.comparisons]]
id = "public-wan-forward"
workload = "large-file"
chart_controls = ["syq-ssh"]
tool_labels = { syq-ssh = "syq over SSH" }
title = "Sending a large file overseas"
description = "Copy one large file from Germany to the US East Coast."
[[overview.comparisons]]
id = "public-ext4-same"
workload = "mixed-tree"
title = "Copying a folder on one drive"
description = "Make another copy of a folder with files of different sizes."
[[overview.comparisons]]
id = "private-nfs-metadata-25k"
workload = "small-files"
title = "Copying small files to a network drive"
description = "Copy a folder of small files onto a shared drive."
note = "A shared drive using NFS."

[[overview.comparisons]]
id = "public-wan-unchanged-tree"
workload = "unchanged-tree"
chart_metric = "time"
title = "Checking a folder that hasn’t changed"
description = "Check whether a folder needs updating, from Germany to the US East Coast."
note = ""

[acceptance]
minimum_repeat_seconds = 3
repeats = 3
syq_revision = "fd2b17c642e62d7ee63f7f3835560a6ceacd0afb"

[[scenarios]]
id = "public-wan-forward"
title = "Copying to a distant server"
kind = "cloud"
primary = "syq"
description = "Send a file or folder from Germany to the US East Coast."
note = "Files stay in memory, so this tests the connection rather than disk writes."
setup = "syq 0.5.2, source fd2b17c; static GNU build with Rust 1.94.1. Three rotated repetitions, each checksum-verified outside timing. Generated incompressible data, seed 204330278; compression off. No final flush: completion is not a durability measurement. Two Hetzner Cloud CCX23 guests, each with 4 dedicated vCPUs and 16 GiB RAM, Debian 13. Warm tmpfs at both endpoints. Default syq uses SSH-authenticated encrypted TCP; the SSH control disables TCP; rsync uses SSH. Packet counters independently checked large-file data paths. Small-file data paths were not recorded per repetition. Both directions share allocations and are separate comparisons, not independent replications. Germany → US East Coast; approximately 107 ms round-trip latency. "
manual_recipe = "specs/release-052/README.md"
captures = ["data/release-052-public-wan-forward.json"]
workload_selection = ["large-file", "large-files", "small-files"]
explained_captures = ["17792da3d69fd0c7af636cd84a1a02a9445ccc713514f5e5db3a85f7e6a2a46a"]
[scenarios.controls]
syq = "Automatic"
syq-j32 = "32 workers"
syq-ssh = "Transfer over SSH"
[scenarios.workloads]
large-file = "One large file"
large-files = "A folder of large files"
small-files = "Many small files"
[scenarios.explanations]
large-file = { basis = "likely", text = "syq transfers different parts of the same file in parallel, including over SSH. Its default mode adds another speedup by sending the data over separate encrypted TCP connections, using SSH only to log in." }
large-files = { basis = "likely", text = "syq copies several files at once and can split each file across several encrypted TCP connections. It uses SSH to log in, but the file data can bypass SSH." }
small-files = { basis = "unknown", text = "rsync finishes sooner here. Sending lots of small files involves work for each file, even though syq groups them together for transfer. We’re still investigating the gap." }

