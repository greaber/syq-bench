[[scenarios]]
id = "public-wan-forward"
title = "Copying to a distant server"
kind = "cloud"
primary = "syq"
description = "Send a file or folder from Germany to the US East Coast."
note = "Files stay in memory, so this tests the connection rather than disk writes."
setup = "Official syq 0.6.0 Linux release executable. Three rotated repetitions for each displayed tool; current 0.5.2 controls followed the first automatic syq repeat and are retained separately. Contents checked outside timing. Generated incompressible data, seed 204330278. No final flush: completion does not establish durability. GNU time command wrapper; host snapshots outside timing. Two Hetzner Cloud CCX23 guests, each with 4 dedicated vCPUs and 16 GiB RAM, Debian 13; warm tmpfs at both endpoints. Germany to US East Coast, approximately 108 ms RTT. Default syq uses SSH-authenticated encrypted TCP; the SSH control disables TCP; rsync uses SSH. "
manual_recipe = "specs/release-060/README.md"
captures = ["data/release-060-public-wan-forward.json"]
workload_selection = ["large-file"]
controls = { syq = "Automatic", syq-j32 = "32 workers", syq-ssh = "Transfer over SSH" }
workloads = { large-file = "One large file", large-files = "A folder of large files", small-files = "Many small files" }

